---
name: Read Build publication
"on":
  push:
    branches:
      - main
permissions: {}
jobs:
  publish:
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      image_reference: ${{ steps.publication.outputs.image_reference }}
      deploy_reference: ${{ steps.publication.outputs.deploy_reference }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read successful canonical Build publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run --no-project --no-config --python 3.13 python -m scripts.build_publication
