---
name: Build
"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "launchplane/train/**"
permissions: {}
jobs:
  validate:
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - chris-testing
      - chris-testing-discord-blue
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Install Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-groups --python 3.13
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Test
        run: uv run python -m unittest discover -s tests -q

  image:
    needs: validate
    outputs:
      image_repository: ${{ steps.image.outputs.image }}
      tag_sha: ${{ steps.image.outputs.tag_sha }}
      tag_main: ${{ steps.image.outputs.tag_main }}
      cache: ${{ steps.image.outputs.cache }}
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - chris-testing
      - chris-testing-discord-blue
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set image metadata
        id: image
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run --no-project --no-config --python 3.13 python -m scripts.image_metadata
        shell: bash
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.tag_sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}
      - name: Qualify managed runtime Compose
        env:
          QUALIFICATION_IMAGE: ${{ steps.image.outputs.tag_sha }}
        run: |
          DISCORD_BLUE_COMPOSE_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' "$QUALIFICATION_IMAGE")"
          export DISCORD_BLUE_COMPOSE_TEST_IMAGE
          "$HOME/.local/bin/uv" run --python 3.13 python -m unittest tests.test_runtime_compose -v

  publish:
    needs: image
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    runs-on:
      - self-hosted
      - chris-testing
      - chris-testing-discord-blue
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and publish container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ needs.image.outputs.tag_sha }}
            ${{ needs.image.outputs.tag_main }}
          cache-from: type=registry,ref=${{ needs.image.outputs.cache }}
          cache-to: type=registry,ref=${{ needs.image.outputs.cache }},mode=max
      - name: Qualify published runtime image
        env:
          PUBLISHED_IMAGE: ${{ needs.image.outputs.image_repository }}@${{ steps.push.outputs.digest }}
        run: |
          docker pull "$PUBLISHED_IMAGE"
          DISCORD_BLUE_COMPOSE_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' "$PUBLISHED_IMAGE")"
          export DISCORD_BLUE_COMPOSE_TEST_IMAGE
          "$HOME/.local/bin/uv" run --python 3.13 python -m unittest tests.test_runtime_compose -v
      - name: Write artifact manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_REFERENCE: ${{ needs.image.outputs.image_repository }}@${{ steps.push.outputs.digest }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run --no-project --no-config --python 3.13 python -m scripts.artifact_manifest
      - name: Upload artifact manifest
        uses: actions/upload-artifact@v7
        with:
          name: artifact-manifest-${{ github.run_attempt }}
          path: artifact-manifest.json
          if-no-files-found: error

  ci_gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - validate
      - image
      - publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm validation and image jobs passed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_REQUIRED: >-
            ${{ github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail

          if [ "$VALIDATE_RESULT" != "success" ] || [ "$IMAGE_RESULT" != "success" ]; then
            echo "validate=$VALIDATE_RESULT" >&2
            echo "image=$IMAGE_RESULT" >&2
            exit 1
          fi

          if [ "$PUBLISH_REQUIRED" = "true" ] && [ "$PUBLISH_RESULT" != "success" ]; then
            echo "publish=$PUBLISH_RESULT" >&2
            exit 1
          fi

          echo "Validation and image checks passed."

