<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUI approval cards</title><style>*{box-sizing:border-box}body{margin:0;background:#222327;color:#f0f0f2;font:16px/1.45 system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:22px}header p{color:#b8bac2;font-size:13px}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h2{font-size:15px;color:#b8bac2;margin:0 0 8px}article{background:#28292e;border:1px solid #4d4e56;border-left:4px solid #f0b232;border-radius:8px;padding:16px}p{margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #474851;margin:16px 0}.row{display:flex;gap:8px;margin-bottom:12px}select{width:100%;background:#1e1f22;border:1px solid #5d5e66;border-radius:5px;padding:10px;color:#eee;font:inherit}button{padding:9px 12px;border:0;border-radius:5px;background:#484a54;color:#fff;font:inherit}button.success{background:#248046}button.primary{background:#5865f2}button.danger{background:#a4323c}pre{background:#1e1f22;border-radius:4px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 ui-monospace,monospace}strong{font-weight:650}@media(max-width:600px){main{padding:12px}.panels{grid-template-columns:1fr}}</style><main><header><h1>DUI · approval buttons</h1><p>Local rendering of actual serialized Components V2 payloads. Controls are illustrative. Functional callbacks are tested separately; Discord owns final typography and sizing.</p></header><div class="panels"></div></main><script>
const panels=[{"name": "Command \u00b7 review the exact request", "components": [{"type": 17, "accent_color": 15774258, "spoiler": false, "components": [{"type": 10, "content": "**Approval requested**\nQuick review: `\u2705` approve \u00b7 `\u2716\ufe0f` deny\n\n```sh\ngit diff --stat\n```\ncwd: `/Users/chris/Developer/discord-blue`\n\nCheck the files changed before committing."}, {"type": 14, "divider": true, "spacing": 1}, {"type": 1, "components": [{"type": 2, "style": 3, "disabled": false, "label": "Approve once", "custom_id": "d3172785467f6a7cd81b874a9285c11d"}, {"type": 2, "style": 4, "disabled": false, "label": "Deny", "custom_id": "1f61afe613c9718211ee4b688ea496e7"}]}]}]}, {"name": "Permissions \u00b7 this turn only", "components": [{"type": 17, "accent_color": 15774258, "spoiler": false, "components": [{"type": 10, "content": "**Permissions (this turn only) approval requested**\nQuick review: `\u2705` approve \u00b7 `\u2716\ufe0f` deny\n\n```json\n{\"network\": {\"enabled\": true}}\n```"}, {"type": 14, "divider": true, "spacing": 1}, {"type": 1, "components": [{"type": 2, "style": 3, "disabled": false, "label": "Approve once", "custom_id": "51d3eefa3f10a76637a111e9358745a9"}, {"type": 2, "style": 4, "disabled": false, "label": "Deny", "custom_id": "1e92bd943ee583e1323bc3ab30475e73"}]}]}]}, {"name": "Decision sent \u00b7 controls removed", "components": [{"type": 17, "accent_color": 5066326, "spoiler": false, "components": [{"type": 10, "content": "**Approval sent**\nWaiting for local agent to accept the decision.\nby: `Chris`"}]}]}, {"name": "Local acknowledgement", "components": [{"type": 17, "accent_color": 5066326, "spoiler": false, "components": [{"type": 10, "content": "**Submitted: approved**\nby: `123`"}]}]}, {"name": "Expired \u00b7 no active controls", "components": [{"type": 17, "accent_color": 5066326, "spoiler": false, "components": [{"type": 10, "content": "**Approval expired**\nRequest resolved in the native terminal."}]}]}];
function component(c){let e;if(c.type===17){e=document.createElement('article');e.style.borderLeftColor='#'+c.accent_color.toString(16).padStart(6,'0');c.components.forEach(x=>e.append(component(x)))}else if(c.type===10){e=document.createElement('p');c.content.split(/(```[a-z]*\n[\s\S]*?```)/g).forEach(t=>{const n=document.createElement(t.startsWith('```')?'pre':'span');n.textContent=t.startsWith('```')?t.replace(/^```[a-z]*\n|```$/g,''):t.replace(/^### /gm,'').replace(/\*\*/g,'').replace(/`/g,'');e.append(n)})}else if(c.type===14){e=document.createElement('hr')}else if(c.type===1){e=document.createElement('div');e.className='row';c.components.forEach(x=>e.append(component(x)))}else if(c.type===3){e=document.createElement('select');e.setAttribute('aria-label',c.placeholder);const placeholder=document.createElement('option');placeholder.textContent=c.placeholder;placeholder.disabled=true;placeholder.selected=!c.options.some(x=>x.default);e.append(placeholder);c.options.forEach(x=>{const o=document.createElement('option');o.textContent=x.label;o.value=x.value;o.selected=x.default;o.title=x.description||'';e.append(o)})}else if(c.type===2){e=document.createElement('button');e.textContent=(c.emoji?.name||'')+' '+c.label;e.className=c.style===1?'primary':c.style===3?'success':c.style===4?'danger':''}else{e=document.createElement('span')}return e}
for(const p of panels){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=p.name;section.append(h);p.components.forEach(c=>section.append(component(c)));document.querySelector('.panels').append(section)}
</script></html>
