<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUI reply and questionnaire forms</title><style>*{box-sizing:border-box}body{margin:0;background:#222327;color:#f0f0f2;font:16px/1.45 system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:22px}header p{color:#b8bac2;font-size:13px}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h2{font-size:15px;color:#b8bac2;margin:0 0 8px}article{background:#28292e;border:1px solid #4d4e56;border-left:4px solid #f0b232;border-radius:8px;padding:16px}p{margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #474851;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}fieldset{border:1px solid #5d5e66;border-radius:6px;margin:0 0 14px;padding:12px;min-width:0}label{display:block;margin:10px 0}label small{display:block;color:#b8bac2;margin-left:25px}textarea{width:100%;min-height:90px;background:#1e1f22;color:#eee;font:inherit;border:1px solid #5d5e66;border-radius:5px;padding:10px}input{accent-color:#5865f2}legend{font-weight:650}select{width:100%;background:#1e1f22;border:1px solid #5d5e66;border-radius:5px;padding:10px;color:#eee;font:inherit}button{padding:9px 12px;border:0;border-radius:5px;background:#484a54;color:#fff;font:inherit}button.primary{background:#5865f2}button.danger{background:#a4323c}strong{font-weight:650}@media(max-width:600px){main{padding:12px}.panels{grid-template-columns:1fr}}</style><main><header><h1>DUI · reply and questionnaire forms</h1><p>Local rendering of actual serialized Components V2 payloads. Controls are illustrative. Functional callbacks are tested separately; Discord owns final typography and sizing.</p></header><div class="panels"></div></main><script>
const panels=[{"name": "Question card \u00b7 picker stays available", "components": [{"type": 17, "accent_color": 15774258, "spoiler": false, "components": [{"type": 10, "content": "### \u23f8 Waiting on you\nChoose an answer for each question, then press **Send answer**."}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "\u2b1c **Scope**\nWhich screens should change?"}, {"type": 1, "components": [{"type": 3, "custom_id": "c93b57cce5b47398fb705222502271a0", "min_values": 1, "max_values": 1, "disabled": false, "required": true, "placeholder": "Scope", "options": [{"label": "1. Current screen", "value": "0", "default": false, "description": "Only this screen"}, {"label": "2. All screens", "value": "1", "default": false, "description": "Apply the same change everywhere"}]}]}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Other answer", "custom_id": "f81bb476d2f218b0f7aa9973efa48784", "emoji": {"id": null, "name": "\u270f\ufe0f"}}]}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "\u2b1c **Priority**\nWhich matters most?"}, {"type": 1, "components": [{"type": 3, "custom_id": "c1300dc84f4b5d5d2218f4636721a7ea", "min_values": 1, "max_values": 1, "disabled": false, "required": true, "placeholder": "Priority", "options": [{"label": "1. Readability", "value": "0", "default": false, "description": "Larger type and more space"}, {"label": "2. Density", "value": "1", "default": false, "description": "More information on each screen"}]}]}, {"type": 14, "divider": true, "spacing": 1}, {"type": 1, "components": [{"type": 2, "style": 1, "disabled": false, "label": "Answer together", "custom_id": "0eab7f03dce27734693f807f6a2038cb"}]}, {"type": 1, "components": [{"type": 2, "style": 1, "disabled": false, "label": "Send answer", "custom_id": "7eef5b28c1496af98969e693453f05eb", "emoji": {"id": null, "name": "\u2705"}}, {"type": 2, "style": 4, "disabled": false, "label": "Cancel", "custom_id": "d22f92a9c0bda50fe7a36ee6319e7339", "emoji": {"id": null, "name": "\u2716\ufe0f"}}]}]}]}, {"name": "Answer together", "components": [{"type": 18, "label": "Scope", "component": {"type": 21, "custom_id": "131ba113a1493dc6bde74151eb6c624c", "required": true, "options": [{"label": "Current screen", "value": "0", "default": false, "description": "Only this screen"}, {"label": "All screens", "value": "1", "default": false, "description": "Apply the same change everywhere"}, {"label": "Other", "value": "other", "default": false}]}, "description": "Which screens should change?"}, {"type": 18, "label": "Scope \u00b7 Other", "component": {"type": 4, "style": 2, "label": null, "custom_id": "1a227bffc31b31d28c2008b1b6e0ed2b", "required": false, "max_length": 1500}, "description": "Fill only when choosing Other."}, {"type": 18, "label": "Priority", "component": {"type": 21, "custom_id": "b0182d44db428a11bcb0b245728eddc2", "required": true, "options": [{"label": "Readability", "value": "0", "default": false, "description": "Larger type and more space"}, {"label": "Density", "value": "1", "default": false, "description": "More information on each screen"}]}, "description": "Which matters most?"}]}, {"name": "Reply about this", "components": [{"type": 10, "content": "**\ud83d\udd37 discord-blue \u00b7 Phone layout**\n> The second option keeps the controls next to the answer, with larger text on the phone.\n[Open answer](https://discord.com/channels/1/555/90)"}, {"type": 18, "label": "Your reply", "component": {"type": 4, "style": 2, "label": null, "custom_id": "2f27f320351f71cde608edea98129dd7", "required": true, "max_length": 1500}}]}, {"name": "Long prompt \u00b7 picker fallback", "components": [{"type": 17, "accent_color": 15774258, "spoiler": false, "components": [{"type": 10, "content": "### \u23f8 Waiting on you\nChoose an answer for each question, then press **Send answer**."}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "\u2b1c **Scope**\nThis is a longer question that should remain visible in full on the card rather than being clipped to fit inside a small modal. Which screen should change?"}, {"type": 1, "components": [{"type": 3, "custom_id": "c885964085e2ad98a3c27e29e68f4e59", "min_values": 1, "max_values": 1, "disabled": false, "required": true, "placeholder": "Scope", "options": [{"label": "1. Current screen", "value": "0", "default": false, "description": "Only this screen"}, {"label": "2. All screens", "value": "1", "default": false, "description": "Apply the same change everywhere"}]}]}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Other answer", "custom_id": "608a28d317ef6297a398bc38eb1cd183", "emoji": {"id": null, "name": "\u270f\ufe0f"}}]}, {"type": 14, "divider": true, "spacing": 1}, {"type": 1, "components": [{"type": 2, "style": 1, "disabled": false, "label": "Send answer", "custom_id": "3c07778c030005d7fd779e1bb9509bcd", "emoji": {"id": null, "name": "\u2705"}}, {"type": 2, "style": 4, "disabled": false, "label": "Cancel", "custom_id": "db2abe2098e7fdfcaf5feb402e798ed6", "emoji": {"id": null, "name": "\u2716\ufe0f"}}]}]}]}];
function component(c){let e;if(c.type===17){e=document.createElement('article');e.style.borderLeftColor='#'+c.accent_color.toString(16).padStart(6,'0');c.components.forEach(x=>e.append(component(x)))}else if(c.type===10){e=document.createElement('p');e.textContent=c.content.replace(/^### /gm,'').replace(/\*\*/g,'')}else if(c.type===14){e=document.createElement('hr')}else if(c.type===1){e=document.createElement('div');e.className='row';c.components.forEach(x=>e.append(component(x)))}else if(c.type===3){e=document.createElement('select');e.setAttribute('aria-label',c.placeholder);const placeholder=document.createElement('option');placeholder.textContent=c.placeholder;placeholder.disabled=true;placeholder.selected=!c.options.some(x=>x.default);e.append(placeholder);c.options.forEach(x=>{const o=document.createElement('option');o.textContent=x.label;o.value=x.value;o.selected=x.default;o.title=x.description||'';e.append(o)})}else if(c.type===18){e=document.createElement('fieldset');const title=document.createElement('legend');title.textContent=c.label;e.append(title);if(c.description){const p=document.createElement('p');p.textContent=c.description;e.append(p)}e.append(component(c.component))}else if(c.type===21){e=document.createElement('div');c.options.forEach(o=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name=c.custom_id;input.value=o.value;label.append(input,document.createTextNode(' '+o.label));if(o.description){const small=document.createElement('small');small.textContent=o.description;label.append(small)}e.append(label)})}else if(c.type===4){e=document.createElement('textarea');e.required=c.required;e.maxLength=c.max_length||4000;e.setAttribute('aria-label','Written answer')}else if(c.type===2){e=document.createElement('button');e.textContent=(c.emoji?.name||'')+' '+c.label;e.className=c.style===1?'primary':c.style===4?'danger':''}else{e=document.createElement('span')}return e}
for(const p of panels){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=p.name;section.append(h);p.components.forEach(c=>section.append(component(c)));document.querySelector('.panels').append(section)}
</script></html>
