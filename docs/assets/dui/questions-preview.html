<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUI question cards</title><style>*{box-sizing:border-box}body{margin:0;background:#222327;color:#f0f0f2;font:16px/1.45 system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:22px}header p{color:#b8bac2;font-size:13px}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h2{font-size:15px;color:#b8bac2;margin:0 0 8px}article{background:#28292e;border:1px solid #4d4e56;border-left:4px solid #f0b232;border-radius:8px;padding:16px}p{margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #474851;margin:16px 0}.row{display:flex;gap:8px;margin-bottom:12px}select{width:100%;background:#1e1f22;border:1px solid #5d5e66;border-radius:5px;padding:10px;color:#eee;font:inherit}button{padding:9px 12px;border:0;border-radius:5px;background:#484a54;color:#fff;font:inherit}button.primary{background:#5865f2}button.danger{background:#a4323c}strong{font-weight:650}@media(max-width:600px){main{padding:12px}.panels{grid-template-columns:1fr}}</style><main><header><h1>DUI · question picker</h1><p>Local rendering of actual serialized Components V2 payloads. Controls are illustrative. Functional callbacks are tested separately; Discord owns final typography and sizing.</p></header><div class="panels"></div></main><script>
const panels=[{"name": "Choose your answers", "components": [{"type": 17, "accent_color": 15774258, "spoiler": false, "components": [{"type": 10, "content": "### \u23f8 Waiting on you\nChoose an answer for each question, then press **Send answer**."}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "\u2b1c **Build mode**\nHow should I verify this change?"}, {"type": 1, "components": [{"type": 3, "custom_id": "87307a810b5b15f30d3c5908d1e73ea2", "min_values": 1, "max_values": 1, "disabled": false, "required": true, "placeholder": "Build mode", "options": [{"label": "1. Focused checks", "value": "0", "default": false, "description": "Run the tests covering this change."}, {"label": "2. Full suite", "value": "1", "default": false, "description": "Run all the repository checks."}]}]}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Other answer", "custom_id": "7995aa269609c18d739bc60dcd24c752", "emoji": {"id": null, "name": "\u270f\ufe0f"}}]}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "\u2b1c **Extra notes**\nAnything else I should check?"}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Write answer", "custom_id": "4ebc782e49ee553788a6ebfb3986a7d2", "emoji": {"id": null, "name": "\u270f\ufe0f"}}]}, {"type": 14, "divider": true, "spacing": 1}, {"type": 1, "components": [{"type": 2, "style": 1, "disabled": false, "label": "Send answer", "custom_id": "2e266e08735b9e95217b5771b44ea9c3", "emoji": {"id": null, "name": "\u2705"}}, {"type": 2, "style": 4, "disabled": false, "label": "Cancel", "custom_id": "7080569ec04deec64cc4eb7ffac50bd1", "emoji": {"id": null, "name": "\u2716\ufe0f"}}]}]}]}, {"name": "Ready to send", "components": [{"type": 17, "accent_color": 15774258, "spoiler": false, "components": [{"type": 10, "content": "### \u23f8 Waiting on you\nChoose an answer for each question, then press **Send answer**."}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "\u2705 **Build mode**\nHow should I verify this change?\nSelected: Full suite"}, {"type": 1, "components": [{"type": 3, "custom_id": "87307a810b5b15f30d3c5908d1e73ea2", "min_values": 1, "max_values": 1, "disabled": false, "required": true, "placeholder": "Build mode", "options": [{"label": "1. Focused checks", "value": "0", "default": false, "description": "Run the tests covering this change."}, {"label": "2. Full suite", "value": "1", "default": true, "description": "Run all the repository checks."}]}]}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Other answer", "custom_id": "7995aa269609c18d739bc60dcd24c752", "emoji": {"id": null, "name": "\u270f\ufe0f"}}]}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "\u2705 **Extra notes**\nAnything else I should check?\nSelected: Check the phone layout too."}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Write answer", "custom_id": "4ebc782e49ee553788a6ebfb3986a7d2", "emoji": {"id": null, "name": "\u270f\ufe0f"}}]}, {"type": 14, "divider": true, "spacing": 1}, {"type": 1, "components": [{"type": 2, "style": 1, "disabled": false, "label": "Send answer", "custom_id": "2e266e08735b9e95217b5771b44ea9c3", "emoji": {"id": null, "name": "\u2705"}}, {"type": 2, "style": 4, "disabled": false, "label": "Cancel", "custom_id": "7080569ec04deec64cc4eb7ffac50bd1", "emoji": {"id": null, "name": "\u2716\ufe0f"}}]}]}]}, {"name": "Sent, awaiting agent", "components": [{"type": 17, "accent_color": 15774258, "spoiler": false, "components": [{"type": 10, "content": "**Answer sent**\nWaiting for local agent to accept the response."}]}]}];
function component(c){let e;if(c.type===17){e=document.createElement('article');c.components.forEach(x=>e.append(component(x)))}else if(c.type===10){e=document.createElement('p');e.textContent=c.content.replace(/^### /gm,'').replace(/\*\*/g,'')}else if(c.type===14){e=document.createElement('hr')}else if(c.type===1){e=document.createElement('div');e.className='row';c.components.forEach(x=>e.append(component(x)))}else if(c.type===3){e=document.createElement('select');e.setAttribute('aria-label',c.placeholder);const placeholder=document.createElement('option');placeholder.textContent=c.placeholder;placeholder.disabled=true;placeholder.selected=!c.options.some(x=>x.default);e.append(placeholder);c.options.forEach(x=>{const o=document.createElement('option');o.textContent=x.label;o.value=x.value;o.selected=x.default;o.title=x.description||'';e.append(o)})}else if(c.type===2){e=document.createElement('button');e.textContent=(c.emoji?.name||'')+' '+c.label;e.className=c.style===1?'primary':c.style===4?'danger':''}else{e=document.createElement('span')}return e}
for(const p of panels){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=p.name;section.append(h);p.components.forEach(c=>section.append(component(c)));document.querySelector('.panels').append(section)}
</script></html>
