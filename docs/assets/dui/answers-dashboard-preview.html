<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUI answers and dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#222327;color:#f0f0f2;font:15px/1.45 system-ui}main{max-width:1000px;margin:auto;padding:16px}h1{font-size:22px}header p{font-size:13px;color:#b8bac2}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h2{font-size:15px;color:#b8bac2}article{background:#28292e;border:1px solid #4d4e56;border-left:4px solid;border-radius:8px;padding:14px}p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #474851}.section{display:flex;align-items:center;gap:12px;margin-bottom:14px}.section p{flex:1;min-width:0}button,a{background:#484a54;color:#fff;padding:8px 10px;border:0;border-radius:5px;font:inherit;text-decoration:none}a{flex-shrink:0;font-size:12px}.file{background:#1e1f22;border:1px solid #4d4e56;border-radius:6px;padding:12px}pre{overflow-wrap:anywhere;white-space:pre-wrap;background:#1e1f22;padding:10px;border-radius:5px;font:12px/1.4 monospace}@media(max-width:600px){.panels{grid-template-columns:1fr}main{padding:12px}}</style><main><header><h1>DUI · Answers and dashboard</h1><p>Local renders of serialized Components V2 payloads. Discord owns final typography and control sizing. No live messages or decisions.</p><button id="empty">Show empty dashboard</button><button id="all">Show all examples</button></header><div class="panels"></div></main><script>const panels=[{"name": "Short answer", "components": [{"type": 17, "accent_color": 5815434, "spoiler": false, "components": [{"type": 10, "content": "### Answer"}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "Updated the session cards and dashboard.\n\n- Final answers keep their full Markdown.\n- Sessions waiting on you appear first.\u2060\u200b"}], "id": 214}]}, {"name": "Long answer with complete file", "components": [{"type": 17, "accent_color": 5815434, "spoiler": false, "components": [{"type": 10, "content": "### Answer"}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "The compact answer preserves the opening context.\n\n```python\nprint(\"A complete answer stays available in the file\")\nprint(\"A complete answer stays available in the file\")\nprint(\"A complete answer stays available in the file\")\nprint(\"A complete answer stays available in the file\")\nprint(\"A complete answer stays available in the file\")\nprint(\"A complete answer stays available in the file\")\nprint(\"A complete answer stays available in the file\")\nprint(\"A complete answer stays available in the file\")\n```\u2060\u200b"}, {"type": 10, "content": "-# Preview above \u00b7 Full answer attached below"}, {"type": 13, "file": {"url": "attachment://answer.md"}, "spoiler": false}], "id": 214}]}, {"name": "Attention first", "components": [{"type": 17, "accent_color": 7703295, "spoiler": false, "components": [{"type": 10, "content": "### Live agent sessions \u00b7 4"}, {"type": 14, "divider": true, "spacing": 1}, {"type": 9, "components": [{"type": 10, "content": "**\u23f8 Waiting on you** \u00b7 \ud83d\udd37 project \u00b7 Discord UI\n-# Mac Studio\nChoose an answer on the question card."}], "accessory": {"type": 2, "style": 5, "disabled": false, "label": "Open thread", "url": "https://discord.com/channels/42/5002"}}, {"type": 9, "components": [{"type": 10, "content": "**\u274c Failed** \u00b7 \u2734\ufe0f project \u00b7 Image build\n-# Mac Studio\nBuild failed; check the native terminal."}], "accessory": {"type": 2, "style": 5, "disabled": false, "label": "Open thread", "url": "https://discord.com/channels/42/5003"}}, {"type": 9, "components": [{"type": 10, "content": "**\ud83d\udd04 Working** \u00b7 \ud83d\udd37 project \u00b7 Layout tests\n-# Mac Studio\nChecking the component payloads."}], "accessory": {"type": 2, "style": 5, "disabled": false, "label": "Open thread", "url": "https://discord.com/channels/42/5000"}}, {"type": 9, "components": [{"type": 10, "content": "**\u2705 Done** \u00b7 \u2734\ufe0f project \u00b7 Thread recovery\n-# Mac Studio\nCompleted; ready for another turn."}], "accessory": {"type": 2, "style": 5, "disabled": false, "label": "Open thread", "url": "https://discord.com/channels/42/5001"}}, {"type": 10, "content": "-# Page 1 of 1 \u00b7 Snapshot <t:1791790100:R>"}]}]}, {"name": "Empty dashboard", "components": [{"type": 17, "accent_color": 7703295, "spoiler": false, "components": [{"type": 10, "content": "### Live agent sessions \u00b7 0"}, {"type": 14, "divider": true, "spacing": 1}, {"type": 10, "content": "No live agent sessions."}, {"type": 10, "content": "-# Page 1 of 1 \u00b7 Snapshot <t:1791790100:R>"}]}]}];
function text(content){const box=document.createElement('div');let code=false,pre;for(const line of content.split('\n')){if(line.startsWith('```')){code=!code;if(code){pre=document.createElement('pre');box.append(pre)}continue}if(code){pre.textContent+=`${line}\n`;continue}const p=document.createElement('p');p.textContent=line.replace(/^### /,'').replaceAll('**','').replace(/^-# /,'');if(line.startsWith('### '))p.style.fontWeight='650';if(line.startsWith('-# ')){p.style.fontSize='12px';p.style.color='#b8bac2'}box.append(p)}return box}
function component(c){let e;if(c.type===17){e=document.createElement('article');e.style.borderLeftColor=`#${c.accent_color.toString(16).padStart(6,'0')}`;c.components.forEach(x=>e.append(component(x)))}else if(c.type===10)e=text(c.content);else if(c.type===14)e=document.createElement('hr');else if(c.type===9){e=document.createElement('div');e.className='section';c.components.forEach(x=>e.append(component(x)));e.append(component(c.accessory))}else if(c.type===2){e=document.createElement('a');e.textContent=c.label;e.href=c.url;e.addEventListener('click',event=>event.preventDefault())}else if(c.type===13){e=document.createElement('div');e.className='file';e.textContent=`📄 ${c.file.url.replace('attachment://','')}`}else e=document.createElement('span');return e}
function show(ps){const root=document.querySelector('.panels');root.replaceChildren();for(const p of ps){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=p.name;section.append(h);p.components.forEach(c=>section.append(component(c)));root.append(section)}}document.querySelector('#empty').onclick=()=>show([panels[3]]);document.querySelector('#all').onclick=()=>show(panels);show(panels);</script></html>
