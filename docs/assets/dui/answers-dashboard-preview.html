function text(content){const box=document.createElement('div');let code=false,pre;for(const line of content.split('\n')){if(line.startsWith('```')){code=!code;if(code){pre=document.createElement('pre');box.append(pre)}continue}if(code){pre.textContent+=`${line}\n`;continue}const p=document.createElement('p');p.textContent=line.replace(/^### /,'').replaceAll('**','').replace(/^-# /,'');if(line.startsWith('### '))p.style.fontWeight='650';if(line.startsWith('-# ')){p.style.fontSize='12px';p.style.color='#b8bac2'}box.append(p)}return box}
function component(c){let e;if(c.type===17){e=document.createElement('article');e.style.borderLeftColor=`#${c.accent_color.toString(16).padStart(6,'0')}`;c.components.forEach(x=>e.append(component(x)))}else if(c.type===10)e=text(c.content);else if(c.type===14)e=document.createElement('hr');else if(c.type===9){e=document.createElement('div');e.className='section';c.components.forEach(x=>e.append(component(x)));e.append(component(c.accessory))}else if(c.type===1){e=document.createElement('div');e.className='row';c.components.forEach(x=>e.append(component(x)))}else if(c.type===3){e=document.createElement('select');e.setAttribute('aria-label',c.placeholder);c.options.forEach(o=>{const option=document.createElement('option');option.textContent=o.label;option.value=o.value;option.selected=o.default;e.append(option)})}else if(c.type===2){e=document.createElement(c.url?'a':'button');e.textContent=c.label;if(c.url)e.href=c.url;e.disabled=c.disabled;e.addEventListener('click',event=>event.preventDefault())}else if(c.type===13){e=document.createElement('div');e.className='file';e.textContent=`📄 ${c.file.url.replace('attachment://','')}`}else e=document.createElement('span');return e}
function show(ps){const root=document.querySelector('.panels');root.replaceChildren();for(const p of ps){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=p.name;section.append(h);p.components.forEach(c=>section.append(component(c)));root.append(section)}}document.querySelector('#empty').onclick=()=>show([panels[panels.length-1]]);document.querySelector('#all').onclick=()=>show(panels);show(panels);</script></html>
