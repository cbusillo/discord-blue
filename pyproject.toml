[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-blue"
version = "0.2.0"
description = "Discord bot plugin system with remote agent session integration"
authors = [{ name = "Chris Busillo", email = "info@shinycomputers.com" }]
readme = "README.md"

requires-python = ">=3.13"
dependencies = [
    "aiohttp",
    "tomli-w",
    "discord.py>=2.6",
    "PyNaCl",
]

[dependency-groups]
dev = [
    "mypy",
    "hatchling",
    "ruff",
]

[project.scripts]
discord-blue = "discord_blue.__main__:main"
discord-blue-codex-bridge = "discord_blue.codex_bridge.__main__:main"
discord-blue-claude-channel = "discord_blue.claude_channel.__main__:main"

[tool.uv]
default-groups = "all"

[tool.ruff]
line-length = 133

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "RUF"]
